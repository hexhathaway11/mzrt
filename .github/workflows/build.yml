name: Build Mozart App (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Move into project directory
        run: cd Mozart-Electron-Repo && ls

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd Mozart-Electron-Repo
          npm install

      - name: Build Electron app
        run: |
          cd Mozart-Electron-Repo
          npm run dist

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: Mozart-macOS
          path: Mozart-Electron-Repo/dist/*.dmg
